version = 1

; Modelos del router de llama-server. Cada seccion es un modelo: el nombre de la
; seccion es el id que ven Open WebUI y Copilot en su selector. Las claves son los
; flags de llama-server sin guiones. Es la UNICA configuracion de los modelos: no hay
; scripts sueltos por modelo. El router arranca --models-max 1: al pedir un modelo descarga
; el otro, asi que nunca estan los dos en VRAM.

; ------------------------------------------------------------- comun a todos
[*]
device = Vulkan0
n-gpu-layers = 99
fit = off
flash-attn = on
parallel = 1
jinja = true
reasoning = on
reasoning-preserve = false
batch-size = 2048
ubatch-size = 512
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.05
; segundos de espera al descargar un modelo antes de forzar el cierre
stop-timeout = 15

; ------------------------------------ Qwen 3.6 35B-A3B (codigo, VS Code Copilot)
; Sin vision, 22 capas de expertos en RAM (con MTP no desborda), ~45 t/s.
; Muestreo de la ficha para codigo con razonamiento, sin limite de razonamiento.
; Es el que precarga "llama start". En Open WebUI conviene ocultarlo
; (Admin Panel > Ajustes > Modelos) para que solo salgan los de uso general.
[Qwen3.6-35B-A3B]
model = D:/LLM/Models/Qwen3.6-35B-A3B-UD-IQ4_XS/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
n-cpu-moe = 22
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
no-mmproj = true
reasoning-budget = -1
temp = 0.6
presence-penalty = 0

; ------------------------------- Qwen 3.6 35B-A3B (uso general, con vision)
; MoE IQ4_XS de 18GB + vision (mmproj F16, 0.9GB): 23 capas de expertos en RAM
; (barrido con VRAM limpia: 22 va al limite, 24-25 procesan las imagenes mas lento).
; Muestreo "thinking, general" de la ficha; razonamiento limitado como en el 9B.
[Qwen3.6-35B-A3B-General]
model = D:/LLM/Models/Qwen3.6-35B-A3B-UD-IQ4_XS/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
mmproj = D:/LLM/Models/Qwen3.6-35B-A3B-UD-IQ4_XS/mmproj-F16.gguf
n-cpu-moe = 23
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
reasoning-budget = 8192
temp = 1.0
presence-penalty = 1.5

; ------------------------------------- Ornith 1.5 9B (uso general, con vision)
; Q8_0 de 9.8GB + vision; KV en q4_0 para que 131k quepa junto al mmproj.
; Sin mlock: con mlock ~1GB acababa en memoria compartida y iba algo mas lento.
; Muestreo "general" de la ficha; razonamiento limitado contra bucles.
[Ornith-1.5-9B]
model = D:/LLM/Models/Ornith-1.5-9B-Q8_0/Ornith-1.5-9B-Q8_0.gguf
mmproj = D:/LLM/Models/Ornith-1.5-9B-Q8_0/mmproj-Ornith-1.5-9B-BF16.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
reasoning-budget = 8192
temp = 1.0
presence-penalty = 1.5
